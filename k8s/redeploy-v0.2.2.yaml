apiVersion: apps/v1
kind: Deployment
metadata:
  name: aliyun-asr-adapter
  namespace: litellm
  labels:
    app.kubernetes.io/name: aliyun-asr-adapter
    app.kubernetes.io/version: "0.2.2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aliyun-asr-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aliyun-asr-adapter
        app.kubernetes.io/version: "0.2.2"
    spec:
      imagePullSecrets:
        - name: REPLACE_WITH_IMAGE_PULL_SECRET
      containers:
        - name: adapter
          image: REPLACE_WITH_PRIVATE_REGISTRY/aliyun-asr-adapter:0.2.2
          imagePullPolicy: IfNotPresent
          env:
            - name: ALIYUN_ASR_MODEL
              value: qwen-audio-3.0-asr-flash-filetrans
            - name: ALIYUN_ASR_COMPATIBLE_MODEL
              value: qwen3-asr-flash
            - name: DASHSCOPE_BASE
              value: https://dashscope.aliyuncs.com
            - name: DASHSCOPE_COMPATIBLE_BASE
              value: https://ws-la2jmsuqq2d1zfv2.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
            - name: ASR_POLL_INTERVAL_SECONDS
              value: "2"
            - name: ASR_POLL_TIMEOUT_SECONDS
              value: "900"
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aliyun-asr-adapter-secrets
                  key: DASHSCOPE_API_KEY
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aliyun-asr-adapter
  namespace: litellm
  labels:
    app.kubernetes.io/name: aliyun-asr-adapter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aliyun-asr-adapter
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
