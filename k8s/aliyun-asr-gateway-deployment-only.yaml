apiVersion: apps/v1
kind: Deployment
metadata:
  name: aliyun-asr-gateway
  namespace: litellm
  labels:
    app.kubernetes.io/name: aliyun-asr-gateway
    app.kubernetes.io/version: "0.2.2"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aliyun-asr-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aliyun-asr-gateway
        app.kubernetes.io/version: "0.2.2"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/x-rite167/aliyun-asr-gateway@sha256:5fa4178351b7066b944673b9f6a28adbf5ec05d6b03c92c82a97c2647649f69d
          imagePullPolicy: IfNotPresent
          command: ["/opt/venv/bin/uvicorn"]
          args: ["app:app", "--host", "0.0.0.0", "--port", "8091"]
          env:
            - name: ALIYUN_ASR_MODEL
              value: qwen-audio-3.0-asr-flash-filetrans
            - name: ALIYUN_ASR_COMPATIBLE_MODEL
              value: qwen3-asr-flash
            - name: DASHSCOPE_BASE
              value: https://dashscope.aliyuncs.com
            - name: DASHSCOPE_COMPATIBLE_BASE
              value: https://ws-la2jmsuqq2d1zfv2.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
            - name: ASR_POLL_INTERVAL_SECONDS
              value: "2"
            - name: ASR_POLL_TIMEOUT_SECONDS
              value: "900"
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: aliyun-asr-secret
                  key: DASHSCOPE_API_KEY
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
